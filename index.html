<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f5f3">
<title>숏폼 업로드 가이드</title>
<style>
@font-face { font-family: 'GMarketSans'; src: url('https://crewlabel-rec.github.io/font/GMARKETSANSTTFMEDIUM.TTF') format('truetype'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'GMarketSans'; src: url('https://crewlabel-rec.github.io/font/GMARKETSANSTTFBOLD.TTF') format('truetype'); font-weight: 700; font-display: swap; }

* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --page: #f5f5f3;
  --card: #ffffff;
  --line: rgba(0,0,0,0.09);
  --text: #141414;
  --sub: #6b6b6b;
  --dark: #0a0a0a;
  --mint: #a8f0d0;
  --mint-ink: #0a5c3a;
  --mint-soft: #e9faf2;
  --red: #c93b3b;
  --red-soft: #fdeeee;
  --gray-pill: #ececea;
}
html, body { background: var(--page); }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  color: var(--text); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  word-break: keep-all;
}
.wrap { max-width: 480px; margin: 0 auto; padding: 0 12px 40px; }
.h { font-family: 'GMarketSans', sans-serif; }

/* ── 상단: 제목 + 탭 (고정) ── */
.top { position: sticky; top: 0; z-index: 10; background: var(--page); padding: 12px 0 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 2px 10px; }
.brand b { font-family: 'GMarketSans', sans-serif; font-weight: 700; font-size: 17px; }
.brand span { font-size: 12px; color: var(--sub); }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--dark); border-radius: 14px; padding: 4px; }
.tab { font-family: 'GMarketSans', sans-serif; font-weight: 500; font-size: 14px; color: rgba(255,255,255,0.65);
  background: transparent; border: 0; border-radius: 10px; padding: 11px 0 8px; cursor: pointer; }
.tab.on { background: var(--mint); color: var(--mint-ink); font-weight: 700; }

/* ── 요약 카드 ── */
.summary { background: var(--dark); color: #fff; border-radius: 16px; padding: 16px 16px 14px; margin: 4px 0 12px; }
.summary .ttl { font-family: 'GMarketSans', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 10px; }
.summary .ttl small { font-weight: 500; font-size: 12px; color: var(--mint); margin-left: 6px; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.chip { background: rgba(255,255,255,0.07); border: 0.5px solid rgba(255,255,255,0.14); border-radius: 10px; padding: 8px 10px; }
.chip i { display: block; font-style: normal; font-size: 11px; color: rgba(255,255,255,0.55); }
.chip b { display: block; font-size: 14px; font-weight: 600; color: #fff; }
.chip b em { font-style: normal; color: var(--mint); }

/* ── 섹션 제목 ── */
.sec.first { margin-top: 4px; }
.sec { font-family: 'GMarketSans', sans-serif; font-weight: 700; font-size: 15px; margin: 22px 4px 8px; display: flex; align-items: center; justify-content: space-between; }
.sec .reset { font-family: inherit; font-weight: 500; font-size: 12px; color: var(--sub); background: var(--card); border: 0.5px solid var(--line); border-radius: 20px; padding: 6px 10px 4px; cursor: pointer; }

/* ── 단계 카드 ── */
.step { background: var(--card); border: 0.5px solid var(--line); border-radius: 14px; padding: 12px 12px 10px; margin-bottom: 8px; transition: opacity .15s; }
.step.done { opacity: 0.45; }
.step-head { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
.num { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--dark); color: #fff; font-family: 'GMarketSans', sans-serif; font-weight: 700; font-size: 12px; display: flex; align-items: center; justify-content: center; padding-top: 2px; margin-top: 1px; }
.step.done .num { background: var(--mint-ink); }
.step-title { flex: 1; font-weight: 700; font-size: 15px; line-height: 1.45; }
.step-where { display: block; font-weight: 500; font-size: 12px; color: var(--sub); margin-top: 2px; }
.check { flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid #c8c8c4; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.step.done .check { background: var(--mint-ink); border-color: var(--mint-ink); }
.step.done .check::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px,-1px); }
.rows { margin: 8px 0 0 34px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 0.5px dashed var(--line); }
.row:first-child { border-top: 0; }
.row .nm { font-size: 13.5px; }
.row .nm small { display: block; font-size: 11.5px; color: var(--sub); line-height: 1.4; }
.note { margin: 6px 0 0 34px; font-size: 12.5px; color: var(--sub); }
.note b { color: var(--text); }

/* ── 배지 ── */
.bd { flex-shrink: 0; font-size: 12px; font-weight: 700; border-radius: 20px; padding: 4px 10px; white-space: nowrap; }
.bd.on { background: var(--mint); color: var(--mint-ink); }
.bd.on::before { content: '● '; font-size: 9px; vertical-align: 1px; }
.bd.off { background: var(--gray-pill); color: #7a7a76; }
.bd.off::before { content: '○ '; font-size: 9px; vertical-align: 1px; }
.bd.empty { background: transparent; color: #8a8a86; border: 1px dashed #b9b9b4; }
.bd.val { background: var(--dark); color: #fff; }
.bd.warn { background: var(--red-soft); color: var(--red); }

/* ── 캡션 / 복사 ── */
.box { background: var(--card); border: 0.5px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
.rules { list-style: none; }
.rules li { position: relative; padding: 5px 0 5px 16px; font-size: 13.5px; border-top: 0.5px dashed var(--line); }
.rules li:first-child { border-top: 0; }
.rules li::before { content: ''; position: absolute; left: 2px; top: 13px; width: 6px; height: 6px; border-radius: 50%; background: var(--mint-ink); }
.tpl { background: #f7f7f5; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.7; color: #3a3a3a; margin-top: 8px; white-space: pre-wrap; }
.tpl .ph { color: var(--mint-ink); font-weight: 700; }
.copy { display: flex; align-items: center; gap: 8px; background: var(--mint-soft); border: 1px solid rgba(10,92,58,0.18); border-radius: 12px; padding: 9px 10px 9px 12px; margin-top: 8px; }
.copy .lbl { flex: 1; min-width: 0; }
.copy .lbl i { display: block; font-style: normal; font-size: 11px; color: var(--mint-ink); font-weight: 700; }
.copy .lbl span { display: block; font-size: 12.5px; color: #2c2c2c; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
.copy button { flex-shrink: 0; font-family: 'GMarketSans', sans-serif; font-weight: 700; font-size: 12px; background: var(--dark); color: #fff; border: 0; border-radius: 9px; padding: 9px 12px 7px; cursor: pointer; }
.copy button.ok { background: var(--mint-ink); }

/* ── 주의 ── */
.warn-box { background: var(--red-soft); border: 1px solid rgba(201,59,59,0.22); border-radius: 14px; padding: 10px 12px; }
.warn-box li { list-style: none; position: relative; padding: 6px 0 6px 22px; font-size: 13.5px; border-top: 0.5px dashed rgba(201,59,59,0.25); }
.warn-box li:first-child { border-top: 0; }
.warn-box li::before { content: '!'; position: absolute; left: 0; top: 7px; width: 15px; height: 15px; border-radius: 50%; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; text-align: center; line-height: 15px; }
.warn-box b { color: var(--red); }

/* ── 비교표 ── */
.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.cmp th, .cmp td { padding: 7px 5px; border-top: 0.5px solid var(--line); text-align: left; vertical-align: top; }
.cmp thead th { border-top: 0; font-family: 'GMarketSans', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--mint-ink); }
.cmp tbody th { font-weight: 700; color: var(--sub); white-space: nowrap; width: 62px; }

.foot { text-align: center; font-size: 11.5px; color: #9a9a96; margin-top: 26px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); background: var(--dark); color: #fff; font-size: 13px; border-radius: 20px; padding: 9px 16px; opacity: 0; transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

/* ===================== ✏️ 수정 영역 끝 ===================== */

const ORDER = ['common', 'insta', 'tiktok', 'threads'];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function render(key) {
  const g = GUIDE[key];
  const done = store.get('done_' + key, []);
  let h = '';
  h += `<section class="summary"><div class="ttl">${g.title}<small>${g.sub}</small></div><div class="chips">` +
       g.chips.map(c => `<div class="chip"><i>${c[0]}</i><b>${c[1]}</b></div>`).join('') + `</div></section>`;

  h += `<div class="sec first"><span>⚠ 먼저 확인</span></div><ul class="warn-box">` + g.cautions.map(c => `<li>${c}</li>`).join('') + `</ul>`;
  h += `<div class="sec"><span>업로드 순서</span><button class="reset" data-reset="${key}">체크 초기화</button></div>`;
  g.steps.forEach((s, i) => {
    const isDone = done.includes(i);
    h += `<div class="step${isDone ? ' done' : ''}" data-step="${i}">
      <div class="step-head"><span class="num">${i + 1}</span>
        <div class="step-title">${s.t}<span class="step-where">${s.w}</span></div><span class="check"></span></div>`;
    if (s.rows.length) {
      h += `<div class="rows">` + s.rows.map(r =>
        `<div class="row"><div class="nm">${r[0]}${r[3] ? `<small>${r[3]}</small>` : ''}</div><span class="bd ${r[2]}">${r[1]}</span></div>`).join('') + `</div>`;
    }
    h += `</div>`;
  });

  if (g.compare) {
    h += `<div class="sec"><span>플랫폼 비교</span></div><div class="box"><table class="cmp"><thead><tr>` +
         g.compare.head.map(x => `<th>${x}</th>`).join('') + `</tr></thead><tbody>` +
         g.compare.rows.map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('') +
         `</tbody></table></div>`;
  }

  if (g.caption) {
    h += `<div class="sec"><span>캡션 형식</span></div><div class="box"><ul class="rules">` +
         g.caption.rules.map(r => `<li>${r}</li>`).join('') + `</ul><div class="tpl">${g.caption.tpl}</div>` +
         g.caption.copies.map((c, j) => `<div class="copy"><div class="lbl"><i>${c[0]}</i><span>${esc(c[1])}</span></div>
           <button data-copy="${key}|${j}">복사</button></div>`).join('') + `</div>`;
  }

  document.getElementById('view').innerHTML = h;
}

function setTab(key) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.key === key));
  render(key); store.set('tab', key); window.scrollTo(0, 0);
}

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1300); }

function copyText(text, btn) {
  const done = () => { toast('복사됨'); btn.textContent = '완료'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('ok'); }, 1300); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, () => fallback()); } else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('복사 실패 — 길게 눌러 직접 복사'); } ta.remove(); }
}

document.getElementById('tabs').innerHTML = ORDER.map(k => `<button class="tab" data-key="${k}">${GUIDE[k].tab}</button>`).join('');
document.addEventListener('click', e => {
  const tab = e.target.closest('.tab'); if (tab) return setTab(tab.dataset.key);
  const cp = e.target.closest('[data-copy]'); if (cp) { const [k, j] = cp.dataset.copy.split('|'); return copyText(GUIDE[k].caption.copies[+j][1], cp); }
  const rs = e.target.closest('[data-reset]'); if (rs) { store.set('done_' + rs.dataset.reset, []); render(rs.dataset.reset); return toast('체크 초기화'); }
  const head = e.target.closest('.step-head'); if (head) {
    const key = store.get('tab', 'common'); const i = +head.parentElement.dataset.step;
    let d = store.get('done_' + key, []); d = d.includes(i) ? d.filter(x => x !== i) : d.concat(i);
    store.set('done_' + key, d); head.parentElement.classList.toggle('done');
  }
});
setTab(ORDER.includes(store.get('tab', 'common')) ? store.get('tab', 'common') : 'common');
</script>
